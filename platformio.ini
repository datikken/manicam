; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; ПРОЕКТ ИЗ ДВУХ ПЛАТ (см. src/main.cpp и src/joystick.cpp)
;   [env:servo_board]  — ведомый: приём по I2C, два сервопривода + светодиод
;   [env:master_board] — мастер: джойстик + кнопка, шлёт пакеты ведомому
;
; Оба файла лежат в общем src/ и определяют setup()/loop(), поэтому собрать
; их одновременно нельзя: каждый env через build_src_filter компилирует
; ТОЛЬКО свой файл. Загружайте по одному на каждую плату:
;   pio run -e servo_board  -t upload   ; плата с сервами
;   pio run -e master_board -t upload   ; плата с джойстиком
;
; Имена env намеренно НЕ "servo"/"master": "servo" уже занят именем библиотеки
; в lib_deps, и Library Manager ругался на неоднозначность.
; ---------------------------------------------------------------------------

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

; I2C (Wire) and servo (Servo) libraries.
; Wire ships with framework-arduino-avr, Servo is pulled by the library manager.
lib_deps =
    wire
    servo

; Resolve dependencies through #include in sources (Wire.h, Servo.h).
lib_ldf_mode = deep+

; Board ships with an Optiboot/CH340 clone bootloader that talks at 115200.
; The stock atmelavr board definition uploads at 57600 -> "stk500 not in sync".
upload_speed = 115200
upload_flags =
    -D

monitor_speed = 115200


; --- Ведомый: сервоприводы (D9, D10) + светодиод (D4), приём по I2C ---
[env:servo_board]
build_src_filter = +<main-servo.cpp>


; --- Мастер: джойстик (A0, A1) + кнопка (D2), передача по I2C ---
[env:master_board]
build_src_filter = +<main-joystick.cpp>
