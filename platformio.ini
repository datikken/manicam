; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; ПРОЕКТ ИЗ ДВУХ ПЛАТ
;   [env:servo_board]  — ведомый: приём по I2C, два сервопривода + светодиод
;   [env:master_board] — мастер: джойстик + кнопка, шлёт пакеты ведомому
;
; Общие классы лежат в src/<Имя>/ и компилируются ОБОИМИ прошивками:
;   Link/           — протокол (JoystickFrame) + мастер и ведомый шины
;   Axis/           — один сервопривод (позиция, пределы, шаг за шагом)
;   AxisDriver/     — отображение «насколько отклонён стик» -> «как быстро шагать»
;   Joystick/       — джойстик: мёртвая зона, антидребезг кнопки
;   PositionStore/  — сохранение позы в EEPROM и восстановление при включении
;
; Оба main-файла определяют setup()/loop(), поэтому в одну прошивку они
; попадать не должны. Каждый env через build_src_filter собирает свой main
; плюс общие классы, и исключает main другой платы:
;   pio run -e servo_board  -t upload   ; плата с сервами
;   pio run -e master_board -t upload   ; плата с джойстиком
;
; Имена env намеренно НЕ "servo"/"master": "servo" уже занят именем библиотеки
; в lib_deps, и Library Manager ругался на неоднозначность.
; ---------------------------------------------------------------------------

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

; I2C (Wire) and servo (Servo) libraries.
; Wire ships with framework-arduino-avr, Servo is pulled by the library manager.
lib_deps =
    wire
    servo

; Resolve dependencies through #include in sources (Wire.h, Servo.h).
lib_ldf_mode = deep+

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -Wsign-conversion
; Board ships with an Optiboot/CH340 clone bootloader that talks at 115200.
; The stock atmelavr board definition uploads at 57600 -> "stk500 not in sync".
upload_speed = 115200
upload_flags =
    -D

monitor_speed = 115200


; --- Ведомый: сервоприводы (D9, D10) + светодиод (D4), приём по I2C ---
[env:servo_board]
build_src_filter =
    +<main-servo.cpp>
    +<Axis/> +<AxisDriver/> +<Link/> +<PositionStore/>
    -<main-joystick.cpp>


; --- Мастер: джойстик (A0, A1) + кнопка (D2), передача по I2C ---
[env:master_board]
build_src_filter =
    +<main-joystick.cpp>
    +<Joystick/> +<Link/>
    -<main-servo.cpp>


